  en: "Weekly weights for BTC, ETH and three rTokens (S&P 500, gold, long Treasuries), with the rest held in USDT"
  zh: "每周给出 BTC、ETH 与三只 rToken（标普500、黄金、长期美债）的权重，其余持有 USDT"
  zh-tw: "每週給出 BTC、ETH 與三檔 rToken（標普500、黃金、長期美債）的權重，其餘持有 USDT"
  es: "Pesos semanales para BTC, ETH y tres rTokens (S&P 500, oro, bonos del Tesoro a largo plazo); el resto se mantiene en USDT"
